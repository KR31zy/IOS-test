services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anirepro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: anirepro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - anirepro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anirepro"]
      interval: 5s
      retries: 10
volumes:
  anirepro_pgdata:

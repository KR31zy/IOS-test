name: anirepro360_mobile
description: AniRepro 360 farm workspace for Android and iOS.
publish_to: none
version: 2.4.0+10
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.4'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  url_launcher: ^6.3.2
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  share_plus: ^10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/herd-hero.jpg
    - assets/google_g.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  background_color_ios: '#FFFFFF'
